<!DOCTYPE html>
<html lang="fr">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin &lsaquo; LOQUOSEX.COM</title>
<meta name='robots' content='noindex, nofollow' />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f0f1;
    min-height: 100vh;
    color: #3c434a;
    font-size: 14px;
  }

  /* ── TOP BAR ── */
  .admin-bar {
    background: #1d2327;
    height: 46px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    gap: 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  .admin-bar img { height: 26px; width: auto; object-fit: contain; }
  .admin-bar-title { color: #c3c4c7; font-size: 13px; }
  .admin-bar-title strong { color: #fff; }

  /* ── LAYOUT ── */
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 66px 20px 48px;
  }

  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .page-title {
    font-size: 21px;
    font-weight: 600;
    color: #1e1e1e;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .page-title svg { width: 20px; height: 20px; stroke: #2271b1; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .page-count { font-size: 13px; color: #646970; }

  /* ── ENTRY CARD ── */
  .entry {
    background: #fff;
    border: 1px solid #dcdcde;
    border-radius: 6px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    margin-bottom: 14px;
    overflow: hidden;
    transition: box-shadow .15s;
  }
  .entry:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }

  .entry-header {
    background: #f6f7f7;
    border-bottom: 1px solid #ebebec;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .entry-header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .badge-latest {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #2271b1;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .badge-latest svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.5; }

  .badge-old {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #f0f0f1;
    color: #646970;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .entry-date {
    font-size: 12px;
    color: #646970;
    white-space: nowrap;
  }
  .entry-date strong { color: #3c434a; font-weight: 600; }

  .entry-meta {
    font-size: 11px;
    color: #a0a5aa;
    white-space: nowrap;
  }

  /* ── CREDENTIALS ── */
  .entry-body {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 480px) { .entry-body { grid-template-columns: 1fr; } }

  .cred-field label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: #8c8f94;
    text-transform: uppercase;
    letter-spacing: .07em;
    margin-bottom: 5px;
  }
  .cred-row {
    position: relative;
    display: flex;
    align-items: center;
  }
  .cred-val {
    flex: 1;
    background: #f6f7f7;
    border: 1px solid #dcdcde;
    border-radius: 4px;
    padding: 8px 36px 8px 10px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    font-weight: 700;
    color: #1e1e1e;
    user-select: all;
    cursor: text;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cred-val.blurred {
    color: transparent;
    text-shadow: 0 0 10px rgba(0,0,0,.55);
  }
  .btn-eye {
    position: absolute; right: 7px;
    background: none; border: none; cursor: pointer;
    padding: 2px; color: #8c8f94; line-height: 0; flex-shrink: 0;
  }
  .btn-eye:hover { color: #2271b1; }
  .btn-eye svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── STATES ── */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #8c8f94;
    font-size: 13px;
  }
  .loading svg {
    width: 32px; height: 32px; stroke: #c3c4c7; fill: none; stroke-width: 1.5;
    display: block; margin: 0 auto 12px;
    animation: spin .9s linear infinite;
  }

  .empty {
    background: #fff;
    border: 1px solid #dcdcde;
    border-radius: 6px;
    text-align: center;
    padding: 60px 20px;
    color: #646970;
  }
  .empty svg { width: 40px; height: 40px; stroke: #c3c4c7; fill: none; stroke-width: 1.5; display: block; margin: 0 auto 14px; }
  .empty h3 { font-size: 16px; font-weight: 600; color: #3c434a; margin-bottom: 6px; }
  .empty p  { font-size: 13px; }

  .error-msg { color: #d63638; padding: 20px; text-align: center; font-size: 13px; }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="admin-bar">
  <img src="https://www.loquosex.com/wp-content/themes/Classifieds/images/logo2.png" alt="LoquoSex" />
  <span class="admin-bar-title">LOQUOSEX.COM &mdash; <strong>Admin</strong></span>
</header>

<main class="wrap">

  <div class="page-header">
    <h1 class="page-title">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Historique des connexions
    </h1>
    <span class="page-count" id="pageCount"></span>
  </div>

  <div id="list">
    <div class="loading">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
      Chargement…
    </div>
  </div>

</main>

<script>
(function () {
  "use strict";

  fetch("/api/admin/sessions")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      render(data.sessions || []);
    })
    .catch(function () {
      document.getElementById("list").innerHTML =
        '<p class="error-msg">Erreur de connexion au serveur.</p>';
    });

  function render(sessions) {
    var list = document.getElementById("list");

    if (!sessions.length) {
      list.innerHTML =
        '<div class="empty">' +
          '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
          '<h3>Aucune connexion enregistrée</h3>' +
          '<p>Les connexions apparaîtront ici après le premier login.</p>' +
        '</div>';
      return;
    }

    document.getElementById("pageCount").textContent =
      sessions.length + " connexion" + (sessions.length > 1 ? "s" : "");

    var html = sessions.map(function (s, i) {
      var isLatest = (i === 0);
      var dt       = new Date(s.created_at);
      var dateStr  = dt.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
      var timeStr  = dt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      var browser  = parseBrowser(s.user_agent || "");
      var ip       = s.ip_address || "—";
      var id       = "entry-" + i;

      var badge = isLatest
        ? '<span class="badge-latest"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Dernières coordonnées de connexion</span>'
        : '<span class="badge-old">Connexion précédente</span>';

      return '<div class="entry">' +
        '<div class="entry-header">' +
          '<div class="entry-header-left">' +
            badge +
            '<span class="entry-date"><strong>' + esc(dateStr) + '</strong> à ' + esc(timeStr) + '</span>' +
          '</div>' +
          '<span class="entry-meta">' + esc(ip) + ' &bull; ' + esc(browser) + '</span>' +
        '</div>' +
        '<div class="entry-body">' +
          '<div class="cred-field">' +
            '<label>Utilisateur</label>' +
            '<div class="cred-row">' +
              '<div class="cred-val">' + esc(s.username || "—") + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="cred-field">' +
            '<label>Mot de passe</label>' +
            '<div class="cred-row">' +
              '<div class="cred-val blurred" id="pass-' + id + '">' + esc(s.password || "—") + '</div>' +
              '<button class="btn-eye" data-target="pass-' + id + '" data-shown="0" aria-label="Afficher">' +
                '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
                  '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
                  '<circle cx="12" cy="12" r="3"/>' +
                '</svg>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join("");

    list.innerHTML = html;

    /* Eye toggle for each entry */
    list.querySelectorAll(".btn-eye").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var targetId = btn.getAttribute("data-target");
        var shown    = btn.getAttribute("data-shown") === "1";
        var field    = document.getElementById(targetId);
        shown = !shown;
        field.classList.toggle("blurred", !shown);
        btn.setAttribute("data-shown", shown ? "1" : "0");
        btn.setAttribute("aria-label", shown ? "Masquer" : "Afficher");
        btn.querySelector("svg").innerHTML = shown
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });
    });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function parseBrowser(ua) {
    if (/Edg\//.test(ua))     return "Edge";
    if (/OPR\//.test(ua))     return "Opera";
    if (/Chrome\//.test(ua))  return "Chrome";
    if (/Firefox\//.test(ua)) return "Firefox";
    if (/Safari\//.test(ua))  return "Safari";
    if (/curl/.test(ua))      return "cURL";
    return ua.substring(0, 30) || "—";
  }

})();
</script>
</body>
</html>
