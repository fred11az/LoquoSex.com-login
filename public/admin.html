<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin &lsaquo; LOQUOSEX.COM</title>
<meta name='robots' content='noindex, nofollow' />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f0f1;
    min-height: 100vh;
    color: #3c434a;
    font-size: 14px;
  }

  /* ── TOP BAR ── */
  .admin-bar {
    background: #1d2327;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    box-shadow: 0 1px 0 rgba(0,0,0,.2);
  }
  .admin-bar-left { display: flex; align-items: center; gap: 14px; }
  .admin-bar-logo { height: 26px; width: auto; object-fit: contain; }
  .admin-bar-site { color: #c3c4c7; font-size: 13px; text-decoration: none; }
  .admin-bar-right { display: flex; align-items: center; gap: 12px; }

  /* ── LAYOUT ── */
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 70px 20px 40px;
  }

  .page-title {
    font-size: 22px;
    font-weight: 600;
    color: #1e1e1e;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-title svg { width: 22px; height: 22px; stroke: #2271b1; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── CARD ── */
  .card {
    background: #fff;
    border: 1px solid #c3c4c7;
    border-radius: 6px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .card-header {
    background: #f6f7f7;
    border-bottom: 1px solid #dcdcde;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-header h2 { font-size: 14px; font-weight: 600; color: #1e1e1e; }
  .card-header svg { width: 16px; height: 16px; stroke: #646970; fill: none; stroke-width: 2; flex-shrink: 0; }
  .card-body { padding: 24px 20px; }

  /* ── CREDENTIALS ── */
  .cred-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 540px) { .cred-grid { grid-template-columns: 1fr; } }

  .cred-field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #646970;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 6px;
  }
  .cred-input-wrap { position: relative; }
  .cred-input {
    width: 100%;
    background: #f6f7f7;
    border: 1px solid #dcdcde;
    border-radius: 4px;
    padding: 10px 40px 10px 12px;
    font-size: 15px;
    font-family: "Courier New", monospace;
    color: #1e1e1e;
    font-weight: 700;
    cursor: text;
    user-select: all;
  }
  .cred-input.blurred { color: transparent; text-shadow: 0 0 12px rgba(0,0,0,.6); }

  .btn-eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 2px; color: #646970; line-height: 0;
  }
  .btn-eye:hover { color: #2271b1; }
  .btn-eye svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .cred-hint { font-size: 11px; color: #aaa; margin-top: 5px; }

  .cred-actions { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-copy {
    display: inline-flex; align-items: center; gap: 6px;
    background: #2271b1; color: #fff; border: none; border-radius: 4px;
    padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; transition: background .2s;
  }
  .btn-copy:hover { background: #135e96; }
  .btn-copy svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
  .copy-ok { font-size: 12px; color: #00a32a; display: none; }
  .copy-ok.show { display: inline; }

  /* ── SESSIONS TABLE ── */
  .sessions-meta { font-size: 12px; color: #646970; margin-bottom: 14px; }
  .sessions-meta strong { color: #1e1e1e; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #f6f7f7; border-bottom: 2px solid #dcdcde;
    padding: 10px 12px; text-align: left; font-weight: 600; color: #50575e;
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
  }
  tbody td {
    padding: 10px 12px; border-bottom: 1px solid #f0f0f1;
    color: #3c434a; vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f6f7f7; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-active  { background: #e6f3e6; color: #00a32a; }
  .badge-expired { background: #f0f0f1; color: #646970; }

  .ua-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #646970; font-size: 12px; }

  .empty-state { text-align: center; padding: 40px 20px; color: #646970; }
  .empty-state svg { width: 38px; height: 38px; stroke: #c3c4c7; fill: none; stroke-width: 1.5; display: block; margin: 0 auto 12px; }

  .spinner { text-align: center; padding: 30px; color: #646970; font-size: 13px; }

  @media (max-width: 480px) { .wrap { padding: 62px 12px 30px; } }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="admin-bar">
  <div class="admin-bar-left">
    <img class="admin-bar-logo"
         src="https://www.loquosex.com/wp-content/themes/Classifieds/images/logo2.png"
         alt="LoquoSex.com" />
    <span class="admin-bar-site">LOQUOSEX.COM — Admin</span>
  </div>
</header>

<!-- MAIN -->
<main class="wrap">
  <h1 class="page-title">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    Panel de administración
  </h1>

  <!-- CREDENTIALS CARD -->
  <div class="card">
    <div class="card-header">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <h2>Mis credenciales de acceso</h2>
    </div>
    <div class="card-body" id="credBody">
      <div class="spinner">Cargando…</div>
    </div>
  </div>

  <!-- SESSIONS CARD -->
  <div class="card">
    <div class="card-header">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <h2>Historial de conexiones</h2>
    </div>
    <div class="card-body">
      <div id="sessionsContainer"><div class="spinner">Cargando…</div></div>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  /* ── Credentials ── */
  fetch("/api/admin/credentials")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.user) {
        document.getElementById("credBody").innerHTML = '<p style="color:#d63638">Error al cargar las credenciales.</p>';
        return;
      }
      renderCredentials(data.user, data.pass);
    })
    .catch(function () {
      document.getElementById("credBody").innerHTML = '<p style="color:#d63638">Error de conexión.</p>';
    });

  function renderCredentials(u, p) {
    document.getElementById("credBody").innerHTML =
      '<div class="cred-grid">' +
        '<div class="cred-field">' +
          '<label>Usuario</label>' +
          '<div class="cred-input-wrap">' +
            '<input class="cred-input" id="credUser" type="text" readonly value="' + esc(u) + '" />' +
          '</div>' +
          '<p class="cred-hint">Clic para seleccionar todo</p>' +
        '</div>' +
        '<div class="cred-field">' +
          '<label>Contraseña</label>' +
          '<div class="cred-input-wrap">' +
            '<input class="cred-input blurred" id="credPass" type="text" readonly value="' + esc(p) + '" />' +
            '<button class="btn-eye" id="eyeBtn" type="button" aria-label="Mostrar contraseña">' +
              '<svg id="eyeIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
                '<circle cx="12" cy="12" r="3"/>' +
              '</svg>' +
            '</button>' +
          '</div>' +
          '<p class="cred-hint">Clic en el ojo para revelar</p>' +
        '</div>' +
      '</div>' +
      '<div class="cred-actions">' +
        '<button class="btn-copy" id="copyBtn">' +
          '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
          'Copier le mot de passe' +
        '</button>' +
        '<span class="copy-ok" id="copyOk">&#10003; ¡Copiado!</span>' +
      '</div>';

    var revealed  = false;
    var passField = document.getElementById("credPass");

    document.getElementById("eyeBtn").addEventListener("click", function () {
      revealed = !revealed;
      passField.classList.toggle("blurred", !revealed);
      this.setAttribute("aria-label", revealed ? "Ocultar contraseña" : "Mostrar contraseña");
      document.getElementById("eyeIcon").innerHTML = revealed
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    document.getElementById("copyBtn").addEventListener("click", function () {
      navigator.clipboard.writeText(p).then(function () {
        var ok = document.getElementById("copyOk");
        ok.classList.add("show");
        setTimeout(function () { ok.classList.remove("show"); }, 2000);
      });
    });
  }

  /* ── Sessions ── */
  fetch("/api/admin/sessions")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var el = document.getElementById("sessionsContainer");
      if (!data.sessions || !data.sessions.length) {
        el.innerHTML =
          '<div class="empty-state">' +
            '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
            'No hay conexiones registradas todavía.' +
          '</div>';
        return;
      }
      var now = Date.now();
      var rows = data.sessions.map(function (s) {
        var active  = s.is_active && new Date(s.expires_at).getTime() > now;
        var badge   = active
          ? '<span class="badge badge-active">&#9679; Activa</span>'
          : '<span class="badge badge-expired">Expirada</span>';
        var dt      = new Date(s.created_at);
        var dateStr = dt.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
        var timeStr = dt.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
        return '<tr>' +
          '<td>' + esc(dateStr) + '<br><span style="font-size:11px;color:#888">' + esc(timeStr) + '</span></td>' +
          '<td>' + esc(s.ip_address || "—") + '</td>' +
          '<td><span class="ua-cell" title="' + esc(s.user_agent || "") + '">' + esc(parseBrowser(s.user_agent || "")) + '</span></td>' +
          '<td>' + badge + '</td>' +
        '</tr>';
      }).join("");
      el.innerHTML =
        '<p class="sessions-meta">Últimas <strong>' + data.sessions.length + '</strong> conexiones registradas.</p>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>Fecha / Hora</th><th>IP</th><th>Navegador</th><th>Estado</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>';
    })
    .catch(function () {
      document.getElementById("sessionsContainer").innerHTML =
        '<p style="color:#d63638;padding:12px">Error al cargar el historial.</p>';
    });

  /* ── Helpers ── */
  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function parseBrowser(ua) {
    if (/Edg\//.test(ua))     return "Edge";
    if (/OPR\//.test(ua))     return "Opera";
    if (/Chrome\//.test(ua))  return "Chrome";
    if (/Firefox\//.test(ua)) return "Firefox";
    if (/Safari\//.test(ua))  return "Safari";
    if (/curl/.test(ua))      return "cURL";
    return ua.substring(0, 35) || "—";
  }

})();
</script>
</body>
</html>
