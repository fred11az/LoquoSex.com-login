<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width" />
<title>Connexion &lsaquo; LOQUOSEX.COM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><text y='.9em' font-size='80'>❤️</text></svg>" />
<meta name='robots' content='noindex, follow' />
<meta name='referrer' content='strict-origin-when-cross-origin' />
<style>
  /* ============================
     WORDPRESS LOGIN BASE STYLES
     ============================ */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    background: #f0f0f1;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    font-size: 13px;
    line-height: 1.4;
    color: #3c434a;
    margin: 0;
    padding: 0;
  }

  /* ============================
     LOGIN WRAPPER
     ============================ */
  #login {
    width: 360px;
    padding: 8% 0 0;
    margin: auto;
  }

  /* ============================
     LOGO / HEADER
     ============================ */
  #login h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  #login h1 a {
    display: block;
    margin: 0 auto;
    background-image: url(https://www.loquosex.com/wp-content/themes/Classifieds/images/logo2.png);
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    height: 100px;
    width: 360px;
    text-indent: -9999px;
    overflow: hidden;
    outline: 0;
  }

  /* ============================
     LOGIN FORM CARD
     ============================ */
  #loginform {
    margin-top: 20px;
    margin-left: 0;
    padding: 26px 24px 34px;
    font-weight: 400;
    overflow: hidden;
    background: #fff;
    border: 1px solid #c3c4c7;
    border-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }

  /* ============================
     FORM LABELS
     ============================ */
  #loginform label {
    font-size: 14px;
    font-weight: 600;
    display: block;
    margin-bottom: 3px;
    color: #1e1e1e;
  }

  #loginform p {
    margin-bottom: 16px;
  }

  /* ============================
     FORM INPUTS
     ============================ */
  #loginform .input,
  #loginform input[type="text"],
  #loginform input[type="password"] {
    font-size: 24px;
    width: 100%;
    padding: 3px 5px;
    margin: 2px 6px 16px 0;
    border: 1px solid #8c8f94;
    border-radius: 4px;
    background: #fff;
    color: #2c3338;
    font-family: inherit;
    line-height: 1.33;
    min-height: 40px;
    outline: none;
  }

  #loginform .input:focus,
  #loginform input[type="text"]:focus,
  #loginform input[type="password"]:focus {
    border-color: #2271b1;
    box-shadow: 0 0 0 1px #2271b1;
    outline: 2px solid transparent;
  }

  /* ============================
     PASSWORD WRAPPER (WP STYLE)
     ============================ */
  .user-pass-wrap {
    margin-bottom: 16px;
  }

  .user-pass-wrap label {
    display: block;
    margin-bottom: 3px;
  }

  .wp-pwd {
    position: relative;
  }

  .wp-pwd .input {
    padding-right: 46px;
    margin-bottom: 0;
  }

  /* Toggle password button */
  .wp-hide-pw {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    min-height: 40px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 0 4px 4px 0;
    color: #50575e;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wp-hide-pw:hover {
    color: #2271b1;
  }

  .wp-hide-pw:focus {
    color: #2271b1;
    border-color: #2271b1;
    box-shadow: 0 0 0 1px #2271b1;
    outline: 2px solid transparent;
  }

  /* Dashicons for eye icon */
  .dashicons {
    font-size: 20px;
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Eye SVG icons */
  .eye-icon, .eye-off-icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .eye-off-icon {
    display: none;
  }

  .wp-hide-pw.is-visible .eye-icon {
    display: none;
  }

  .wp-hide-pw.is-visible .eye-off-icon {
    display: block;
  }

  /* ============================
     FIELD ERROR MESSAGES
     ============================ */
  .field-error {
    font-size: 12px;
    color: #d63638;
    margin-top: 4px;
    min-height: 0;
    display: none;
  }

  .field-error.is-visible {
    display: block;
  }

  /* ============================
     reCAPTCHA (simulated, matching real Google widget)
     ============================ */
  .gglcptch {
    margin-bottom: 10px;
  }

  .recaptcha-widget {
    width: 302px;
    height: 76px;
    border: 1px solid #d3d3d3;
    border-radius: 3px;
    background: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    user-select: none;
    box-shadow: 0 0 4px rgba(0,0,0,.08);
  }

  .recaptcha-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .recaptcha-checkbox-wrap {
    width: 40px;
    height: 40px;
    border: 2px solid #9aa0a6;
    border-radius: 3px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }

  .recaptcha-checkbox-wrap:hover {
    border-color: #999;
  }

  .recaptcha-checkbox-wrap:focus-visible {
    outline: 2px solid #4285f4;
    outline-offset: 2px;
  }

  .recaptcha-checkbox-wrap.is-checked {
    border-color: #c1c1c1;
  }

  .recaptcha-checkmark {
    display: none;
    width: 18px;
    height: 18px;
  }

  .recaptcha-checkbox-wrap.is-checked .recaptcha-checkmark {
    display: block;
  }

  /* Spinner shown during reCAPTCHA "verification" */
  .recaptcha-spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid #dbdbdb;
    border-top-color: #4285f4;
    border-radius: 50%;
    animation: recaptcha-spin 0.8s linear infinite;
  }

  .recaptcha-checkbox-wrap.is-loading .recaptcha-spinner {
    display: block;
  }

  @keyframes recaptcha-spin {
    to { transform: rotate(360deg); }
  }

  .recaptcha-text {
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: #555;
  }

  .recaptcha-quota {
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 9px;
    color: #c0392b;
    margin-top: 3px;
    line-height: 1.3;
    max-width: 160px;
  }

  .recaptcha-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .recaptcha-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
  }

  .recaptcha-brand {
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: #555;
    line-height: 1;
  }

  .recaptcha-terms {
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 8px;
    color: #888;
    line-height: 1.2;
  }

  .recaptcha-terms a {
    color: #888;
    text-decoration: none;
  }

  .recaptcha-terms a:hover {
    text-decoration: underline;
  }

  /* ============================
     REMEMBER ME + SUBMIT ROW
     ============================ */
  .forgetmenot {
    float: left;
    margin-bottom: 0;
    padding-top: 4px;
  }

  #loginform .forgetmenot label {
    font-size: 13px;
    font-weight: 400;
    display: inline;
    cursor: pointer;
  }

  .forgetmenot input[type="checkbox"] {
    vertical-align: middle;
    margin: 0 4px 0 0;
    cursor: pointer;
    border: 1px solid #8c8f94;
    border-radius: 4px;
    width: 16px;
    height: 16px;
  }

  p.submit {
    margin-bottom: 0;
    clear: none;
    float: right;
  }

  /* Submit button — WP style */
  .button-primary {
    background: #2271b1;
    border: 1px solid #2271b1;
    border-radius: 4px;
    color: #fff;
    font-size: 13px;
    font-weight: 400;
    line-height: 2.15;
    min-height: 32px;
    padding: 0 12px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    display: inline-block;
    font-family: inherit;
  }

  .button-primary:hover {
    background: #135e96;
    border-color: #135e96;
  }

  .button-primary:focus {
    background: #135e96;
    border-color: #135e96;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #2271b1;
    outline: 2px solid transparent;
  }

  .button-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  /* Clear floats */
  #loginform::after {
    content: "";
    display: table;
    clear: both;
  }

  /* ============================
     NAVIGATION LINKS
     ============================ */
  #nav, #backtoblog {
    text-align: center;
    margin: 16px 0 0;
    padding: 0;
  }

  #nav a, #backtoblog a {
    color: #50575e;
    text-decoration: none;
    font-size: 13px;
  }

  #nav a:hover, #backtoblog a:hover {
    color: #2271b1;
  }

  #backtoblog {
    margin-top: 8px;
  }

  /* ============================
     LANGUAGE SWITCHER
     ============================ */
  .language-switcher {
    text-align: center;
    padding-top: 24px;
    max-width: 320px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .language-switcher .dashicons-translation {
    color: #787c82;
    font-size: 20px;
    line-height: 1;
  }

  .language-switcher select {
    font-size: 14px;
    padding: 4px 24px 4px 8px;
    border: 1px solid #8c8f94;
    border-radius: 4px;
    background: #fff;
    color: #2c3338;
    cursor: pointer;
    min-height: 30px;
    font-family: inherit;
    outline: none;
  }

  .language-switcher select:focus {
    border-color: #2271b1;
    box-shadow: 0 0 0 1px #2271b1;
  }

  .language-switcher .button {
    font-size: 13px;
    padding: 0 10px;
    min-height: 30px;
    border: 1px solid #2271b1;
    border-radius: 4px;
    background: #2271b1;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    line-height: 2.15;
  }

  .language-switcher .button:hover {
    background: #135e96;
    border-color: #135e96;
  }

  /* ============================
     RESPONSIVE
     ============================ */
  @media screen and (max-width: 400px) {
    #login {
      width: 100%;
      padding: 20px 16px 0;
    }

    #login h1 a {
      width: 100%;
    }

    #loginform {
      padding: 20px 16px 26px;
    }

    .recaptcha-widget {
      width: 100%;
    }

    .language-switcher {
      max-width: 100%;
    }
  }

  @media screen and (max-width: 320px) {
    .recaptcha-widget {
      padding: 0 8px;
    }

    .recaptcha-text {
      font-size: 12px;
    }
  }
</style>
</head>
<body class="login login-action-login wp-core-ui locale-es-es">

  <!-- ============================
       LOGIN CONTAINER
       ============================ -->
  <div id="login">

    <!-- Logo -->
    <h1>
      <a href="https://www.loquosex.com" title="LoquoSex.com" tabindex="-1">LoquoSex.com</a>
    </h1>

    <!-- ============================
         LOGIN FORM
         ============================ -->
    <form name="loginform" id="loginform" method="post" novalidate
          aria-label="Formulario de inicio de sesión">

      <!-- Username / email -->
      <p>
        <label for="user_login">Nombre de usuario o correo electrónico</label>
        <input type="text"
               name="log"
               id="user_login"
               class="input"
               value=""
               size="20"
               autocapitalize="off"
               autocomplete="username"
               required
               aria-required="true"
               aria-describedby="user_login_error" />
        <span class="field-error" id="user_login_error" role="alert" aria-live="polite"></span>
      </p>

      <!-- Password -->
      <div class="user-pass-wrap">
        <label for="user_pass">Contraseña</label>
        <div class="wp-pwd">
          <input type="password"
                 name="pwd"
                 id="user_pass"
                 class="input password-input"
                 value=""
                 size="20"
                 autocomplete="current-password"
                 spellcheck="false"
                 required
                 aria-required="true"
                 aria-describedby="user_pass_error" />
          <button type="button"
                  class="wp-hide-pw"
                  id="togglePassword"
                  data-toggle="0"
                  aria-label="Mostrar la contraseña">
            <!-- Eye open -->
            <svg class="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye off -->
            <svg class="eye-off-icon" viewBox="0 0 24 24">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-error" id="user_pass_error" role="alert" aria-live="polite"></span>
      </div>

      <!-- ============================
           SIMULATED reCAPTCHA v2
           ============================ -->
      <div class="gglcptch gglcptch_v2">
        <div class="recaptcha-widget" role="group" aria-label="Verificación reCAPTCHA">
          <div class="recaptcha-left">
            <div class="recaptcha-checkbox-wrap"
                 id="recaptchaCheckbox"
                 role="checkbox"
                 aria-checked="false"
                 aria-label="No soy un robot"
                 tabindex="0">
              <!-- Spinner (shown during verification) -->
              <div class="recaptcha-spinner" aria-hidden="true"></div>
              <!-- Green checkmark (shown after verification) -->
              <svg class="recaptcha-checkmark" viewBox="0 0 24 24" fill="none">
                <path d="M20 6L9 17l-5-5" stroke="#4caf50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="recaptcha-text">No soy un robot</span>
          </div>
          <div class="recaptcha-right">
            <img class="recaptcha-logo"
                 src="https://www.gstatic.com/recaptcha/api2/logo_48.png"
                 alt="reCAPTCHA"
                 width="32" height="32" />
            <span class="recaptcha-brand">reCAPTCHA</span>
          </div>
        </div>
      </div>

      <!-- Remember me + Submit -->
      <p class="forgetmenot">
        <input name="rememberme" type="checkbox" id="rememberme" value="forever" />
        <label for="rememberme">Recuérdame</label>
      </p>
      <p class="submit">
        <input type="submit"
               name="wp-submit"
               id="wp-submit"
               class="button button-primary button-large"
               value="Acceder" />
      </p>
    </form>

    <!-- ============================
         NAVIGATION LINKS
         ============================ -->
    <p id="nav">
      <a href="#">¿Has olvidado tu contraseña?</a>
    </p>
    <p id="backtoblog">
      <a href="#">&larr; Ir a LOQUOSEX.COM</a>
    </p>
  </div>

  <!-- ============================
       LANGUAGE SWITCHER
       ============================ -->
  <div class="language-switcher">
    <label for="language-switcher-locales">
      <!-- Translation icon (Aₓ) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="#787c82" stroke-width="1.5" aria-hidden="true"
           style="vertical-align:middle">
        <path d="M5 8l6 6M4 6h16M2 6h2M10 2v2M4 6c0 4 2 7 6 9M14 20l4-9 4 9M15.5 17h5"/>
      </svg>
      <span class="screen-reader-text" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Idioma</span>
    </label>
    <select name="wp_lang" id="language-switcher-locales" aria-label="Seleccionar idioma">
      <option value="en_US" lang="en">English (United States)</option>
      <option value="es_ES" lang="es" selected>Español</option>
    </select>
    <input type="submit" class="button" value="Cambiar" tabindex="-1" onclick="return false;" />
  </div>

  <!-- ============================
       JAVASCRIPT
       ============================ -->
  <script>
    (function () {
      "use strict";

      /* ---- DOM references ---- */
      var form = document.getElementById("loginform");
      var usernameInput = document.getElementById("user_login");
      var passwordInput = document.getElementById("user_pass");
      var usernameError = document.getElementById("user_login_error");
      var passwordError = document.getElementById("user_pass_error");
      var toggleBtn = document.getElementById("togglePassword");
      var recaptchaCheckbox = document.getElementById("recaptchaCheckbox");

      /* ============================
         AUTO-FOCUS USERNAME ON LOAD
         ============================ */
      setTimeout(function () {
        try { usernameInput.focus(); usernameInput.select(); } catch (e) {}
      }, 200);

      /* ============================
         PASSWORD VISIBILITY TOGGLE
         ============================ */
      toggleBtn.addEventListener("click", function () {
        var isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleBtn.classList.toggle("is-visible", isPassword);
        toggleBtn.setAttribute(
          "aria-label",
          isPassword ? "Ocultar la contraseña" : "Mostrar la contraseña"
        );
        passwordInput.focus();
      });

      /* ============================
         reCAPTCHA — SPINNER THEN CHECKMARK
         ============================ */
      var captchaLocked = false;

      function activateRecaptcha() {
        if (captchaLocked) return;
        var isChecked = recaptchaCheckbox.getAttribute("aria-checked") === "true";

        /* If already checked, just uncheck instantly */
        if (isChecked) {
          recaptchaCheckbox.setAttribute("aria-checked", "false");
          recaptchaCheckbox.classList.remove("is-checked");
          return;
        }

        /* Show spinner for ~1.5s, then show checkmark */
        captchaLocked = true;
        recaptchaCheckbox.classList.add("is-loading");

        setTimeout(function () {
          recaptchaCheckbox.classList.remove("is-loading");
          recaptchaCheckbox.classList.add("is-checked");
          recaptchaCheckbox.setAttribute("aria-checked", "true");
          captchaLocked = false;
        }, 1500);
      }

      /* Respond to click on the checkbox box OR the "No soy un robot" text */
      recaptchaCheckbox.parentElement.addEventListener("click", activateRecaptcha);
      recaptchaCheckbox.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          activateRecaptcha();
        }
      });

      passwordInput.addEventListener("input", function () {
        if (passwordInput.value.length > 0) showError(passwordError, "");
      });

      /* ============================
         HELPER: show / hide error
         ============================ */
      function showError(el, msg) {
        el.textContent = msg;
        el.classList.toggle("is-visible", msg.length > 0);
      }

      /* ============================
         FORM SUBMISSION — calls API, then redirects
         ============================ */
      var submitBtn = document.getElementById("wp-submit");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        var val = usernameInput.value.trim();
        var pw = passwordInput.value;
        var captchaChecked = recaptchaCheckbox.getAttribute("aria-checked") === "true";

        /* Check fields are not empty */
        if (val.length === 0) {
          showError(usernameError, "Este campo es obligatorio");
          usernameInput.focus();
          return;
        }
        if (pw.length === 0) {
          showError(passwordError, "Introduce tu contraseña");
          passwordInput.focus();
          return;
        }
        if (!captchaChecked) {
          recaptchaCheckbox.focus();
          return;
        }

        /* Disable button while loading */
        submitBtn.disabled = true;
        submitBtn.value = "Verificando...";

        /* Call the serverless API */
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: val, password: pw })
        })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          if (result.ok && result.data.success) {
            /* Store session and redirect */
            sessionStorage.setItem("lqs_user", result.data.user);
            sessionStorage.setItem("lqs_token", result.data.token);
            window.location.href = "/welcome.html";
          } else {
            showError(usernameError, result.data.error || "Error de autenticación");
            submitBtn.disabled = false;
            submitBtn.value = "Acceder";
          }
        })
        .catch(function () {
          showError(usernameError, "Error de conexión. Inténtalo de nuevo.");
          submitBtn.disabled = false;
          submitBtn.value = "Acceder";
        });
      });
    })();
  </script>
</body>
</html>
